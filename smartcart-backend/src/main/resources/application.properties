spring.application.name=ecommerce-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:ThisIsMyVerySecretKeyForSmartCartJwtAuthentication2026}

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_Tj3KVmFJYtmzjU}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:xyq678W9hIeTFZ2omabWGfDs}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:EcommerceWebhook2026}

# Mail Configuration (Environment variables with safe defaults)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@smartcart.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true